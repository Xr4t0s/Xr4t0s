# Définir le shell par défaut
set -g default-shell /bin/zsh

# Activer la gestion de la souris
set -g mouse on

# Augmenter la taille de l'historique
set -g history-limit 10000

# Barre d'état (status bar)
set -g status on                     # Activer la barre d'état
set -g status-position bottom        # Position : en bas
set -g status-interval 5             # Mettre à jour toutes les 5 secondes
set -g status-bg '#1d1f21'           # Couleur de fond
set -g status-fg '#c5c8c6'           # Couleur du texte

# Informations dans la barre d'état
set -g status-left-length 100
set -g status-left "#[fg=#1d1f21,bg=#98c379,bold] #(whoami)@#H #[fg=#98c379,bg=#282c34] #[fg=#61afef]🔋 #(acpi -b | awk '{print $4}' | tr -d ',') #[fg=#c678dd]🧠 #(free -h | awk '/Mem:/ {print $3\"/\"$2}') #[fg=#e06c75]⚡ #(uptime | awk -F'load average: ' '{print $2}' | cut -d, -f1)"
# Style des fenêtres dans la barre d'état
setw -g window-status-format '#[fg=grey] #I: #[fg=white]#W'  # Format des fenêtres inactives
setw -g window-status-current-format '#[bg=blue,fg=yellow] #I: #W'  # Format des fenêtres actives

# Bordures des panneaux
set -g pane-border-style 'fg=grey'             # Bordure des panneaux inactifs
set -g pane-active-border-style 'fg=green'     # Bordure des panneaux actifs

# Messages et alertes
set -g message-style 'bg=red,fg=white'
set -g message-command-style 'bg=blue,fg=white'

# Paramètres des fenêtres
setw -g aggressive-resize on                   # Redimensionnement automatique des panneaux
setw -g status-bg '#222222'                    # Fond des fenêtres inactives
setw -g status-fg '#aaaaaa'                    # Texte des fenêtres inactives

# Diviser l'écran en panneaux
bind | split-window -h                         # Séparer horizontalement avec '|'
bind - split-window -v                        # Séparer verticalement avec '-'

# Changer la touche de préfixe
unbind C-b                                    # Désactiver la touche par défaut (Ctrl + b)
set -g prefix C-a                             # Utiliser "Ctrl + a" comme touche de préfixe
bind-key C-a send-prefix                      # Rebind de la touche préfixe

# Navigation entre les panneaux
bind -r C-h select-pane -L                    # Ctrl + h : aller à gauche
bind -r C-j select-pane -D                    # Ctrl + j : aller en bas
bind -r C-k select-pane -U                    # Ctrl + k : aller en haut
bind -r C-l select-pane -R                    # Ctrl + l : aller à droite

# Redimensionner les panneaux
bind-key -r C-Up resize-pane -U               # Agrandir vers le haut
bind-key -r C-Down resize-pane -D             # Rétrécir vers le bas
bind-key -r C-Left resize-pane -L             # Rétrécir vers la gauche
bind-key -r C-Right resize-pane -R            # Agrandir vers la droite

# Diviser les panneaux avec des raccourcis
bind-key v split-window -v                    # Panneau vertical avec 'v'
bind-key h split-window -h                    # Panneau horizontal avec 'h'

# Paramétrage du terminal (pour éviter les problèmes d'affichage)
set -g default-terminal "screen-256color"     # Utiliser 256 couleurs

# Sélectionner et naviguer dans les fenêtres
bind s choose-tree                            # Sélection d'une fenêtre/arborescence

# Affichage de l'heure et de la date avec un format personnalisé
set -g status-right "#[fg=#61afef]⏰ %H:%M #[fg=#98c379]📅 %d/%m/%Y"
